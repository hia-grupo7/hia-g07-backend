# HAProxy delante del cluster Patroni. Es el unico punto de entrada a la base para toda la aplicacion.
global
    maxconn 1000

defaults
    mode tcp
    timeout client 30m
    timeout connect 4s
    timeout server 30m

# DNS interno de Docker. HAProxy vuelve a resolver los nombres de los nodos mientras corre: si un contenedor se recrea
# y cambia de IP, HAProxy lo sigue encontrando (sin esto marca todo DOWN hasta reiniciarlo).
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      5s
    hold refused    5s
    hold nx         5s
    hold timeout    5s
    hold valid      5s

# Panel de estado (solo se publica en 127.0.0.1 desde el compose).
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# ESCRITURA (puerto 5000): solo el nodo que Patroni declara lider (/primary responde 200 solo en el lider).
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server patroni2 patroni2:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

# LECTURA (puerto 5001): /read-only responde 200 en el lider Y en las replicas. Con 2 nodos, esto evita quedarse sin
# servidor de lectura cuando la replica se promueve a lider.
listen reads
    bind *:5001
    option httpchk GET /read-only
    http-check expect status 200
    balance roundrobin
    default-server inter 2s fall 2 rise 2
    server patroni1 patroni1:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server patroni2 patroni2:5432 maxconn 100 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

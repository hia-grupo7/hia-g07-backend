# =============================================================================
# default.conf — Configuración de virtual host con Blue/Green routing
# CARD-10: Orquestación Docker Compose y Blue/Green Deployment
#
# Este archivo define el slot activo del backend.
# La variable $ACTIVE_SLOT es reemplazada por el script switch-bluegreen.sh:
#   - "backend-blue"  → slot Blue activo
#   - "backend-green" → slot Green activo
# =============================================================================

# Resolver DNS interno de Docker para resolución dinámica de upstream
resolver 127.0.0.11 valid=30s ipv6=off;

# Upstream del slot activo — modificado por switch-bluegreen.sh
upstream backend-activo {
    server backend-blue:3000;
}

server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # Endpoint de salud del proxy (para healthcheck del contenedor)
    # ------------------------------------------------------------------
    location /health-proxy {
        access_log off;
        return 200 'proxy-ok\n';
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------
    # API del backend — redirige al slot activo (Blue o Green)
    # ------------------------------------------------------------------
    location /api/ {
        set $backend_upstream "http://backend-activo";
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts para evitar conexiones colgadas durante el switch
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # Frontend SPA Angular — sirve archivos estáticos desde el contenedor
    # ------------------------------------------------------------------
    location / {
        set $frontend_upstream "http://rayuela-frontend:80";
        proxy_pass $frontend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache de assets estáticos
        proxy_cache_bypass $http_upgrade;
    }
}

# =============================================================================
# compose.yaml — Stack Completo Rayuela con Blue/Green Deployment y Cloudflare Tunnel
# CARD-10: Orquestación Docker Compose y Blue/Green Deployment
# CARD-15: Publicación Segura en Internet con Cloudflare Tunnel y HTTPS
#
# Uso básico:
#   docker compose --profile blue up -d          # Levantar slot Blue + Tunnel
#   docker compose --profile green up -d         # Levantar slot Green + Tunnel
#   docker compose up -d                         # Levantar infra base + proxy + tunnel
#
# Conmutación sin corte:
#   bash scripts/switch-bluegreen.sh green       # Cambiar de Blue a Green
#   bash scripts/switch-bluegreen.sh blue        # Cambiar de Green a Blue
#
# Ver URL pública de Cloudflare:
#   powershell -File scripts/get-tunnel-url.ps1  # Windows
#   bash scripts/get-tunnel-url.sh               # Linux / macOS
# =============================================================================

networks:
  rayuela-network:
    name: rayuela-network
    driver: bridge

volumes:
  postgres_data:
    name: rayuela_postgres_data
  pgadmin_data:
    name: rayuela_pgadmin_data

services:

  # ===========================================================================
  # CAPA DE DATOS
  # ===========================================================================

  postgres-primary:
    image: postgres:16-alpine
    container_name: rayuela-db-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rayuela-network
    # Seguridad CARD-15: La base de datos es 100% privada dentro de rayuela-network.
    # No se publican puertos al host para garantizar que PostgreSQL no sea accesible desde el exterior.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # ---------------------------------------------------------------------------
  # NODO RÉPLICA (Hot Standby / Solo Lectura) — CARD-08
  # ---------------------------------------------------------------------------
  postgres-replica:
    image: postgres:16-alpine
    container_name: rayuela-db-replica
    restart: unless-stopped
    environment:
      PGPASSWORD: replicator123
    networks:
      - rayuela-network
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      sh -c "
      rm -rf /var/lib/postgresql/data/* &&
      until pg_basebackup -h postgres-primary -U replicator -D /var/lib/postgresql/data -P -Xs -R --checkpoint=fast; do
        echo 'Esperando al nodo primario para clonar catálogo...'; sleep 3;
      done &&
      chown -R postgres:postgres /var/lib/postgresql/data &&
      chmod 0700 /var/lib/postgresql/data &&
      exec su-exec postgres postgres -c hot_standby=on
      "

  # ---------------------------------------------------------------------------
  # POOLER DE CONEXIONES — PgBouncer en puerto 6432 — CARD-08
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: rayuela-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_HOST: postgres-primary
      DB_NAME: ${DB_NAME:-postgres}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 150
      DEFAULT_POOL_SIZE: 25
      LISTEN_PORT: 6432
    networks:
      - rayuela-network
    ports:
      - "6432:6432"
    depends_on:
      postgres-primary:
        condition: service_healthy
        
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rayuela-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@rayuela.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_rayuela_2024}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - rayuela-network
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/misc/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ===========================================================================
  # CAPA DE APLICACIÓN — SLOT BLUE (perfil: blue)
  # ===========================================================================

  backend-blue:
    image: rayuela-backend:1.0.0
    container_name: rayuela-backend-blue
    restart: unless-stopped
    profiles:
      - blue
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_READ_HOST: postgres-replica
      DB_READ_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperDificilDeAdivinarRayuela123!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SLOT: blue
    networks:
      - rayuela-network
    expose:
      - "3000"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # CAPA DE APLICACIÓN — SLOT GREEN (perfil: green)
  # ===========================================================================

  backend-green:
    image: rayuela-backend:1.0.0
    container_name: rayuela-backend-green
    restart: unless-stopped
    profiles:
      - green
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_READ_HOST: postgres-replica
      DB_READ_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-MiClaveSecretaSuperDificilDeAdivinarRayuela123!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SLOT: green
    networks:
      - rayuela-network
    expose:
      - "3000"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # CAPA DE PRESENTACIÓN — Frontend Angular 22 con Nginx
  # ===========================================================================

  frontend:
    image: rayuela-frontend:1.0.0
    container_name: rayuela-frontend
    restart: unless-stopped
    networks:
      - rayuela-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # PROXY INVERSO FRONTAL — Nginx enruta tráfico al slot activo
  # ===========================================================================

  nginx-proxy:
    image: nginx:alpine
    container_name: rayuela-nginx-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rayuela-network
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health-proxy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # PUBLICACIÓN SEGURA EN INTERNET — Cloudflare Tunnel (CARD-15 / NET-01)
  # ===========================================================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rayuela-tunnel
    restart: unless-stopped
    command: >-
      tunnel
      --no-autoupdate
      --url http://nginx-proxy:80
    networks:
      - rayuela-network
    depends_on:
      nginx-proxy:
        condition: service_healthy
name: rayuela-nextcloud

services:
  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NC_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NC_DB_USER:-nextcloud_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/nc_db_password
    secrets:
      - nc_db_password
    volumes:
      - nextcloud_db_data:/var/lib/postgresql/data
    networks:
      - nextcloud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NC_DB_USER:-nextcloud_user} -d ${NC_DB_NAME:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NC_PORT:-8082}:80"
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: ${NC_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NC_DB_USER:-nextcloud_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/nc_db_password
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nc_admin_password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud
    secrets:
      - nc_db_password
      - nc_admin_password
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - nextcloud-net
      - integracion-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true

volumes:
  nextcloud_db_data:
  nextcloud_data:

networks:
  nextcloud-net:
    driver: bridge
    internal: false
  # La crea el stack principal (compose.yaml). Si Nextcloud se levanta solo, crearla antes:
  #   docker network create integracion-net
  integracion-net:
    name: integracion-net
    external: true

secrets:
  nc_db_password:
    file: ../secrets/nc_db_password
  nc_admin_password:
    file: ../secrets/nc_admin_password
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rayuela-backend"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["backend-blue:3000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Un exportador por nodo del cluster (rol, retraso de replicacion, conexiones, transacciones).
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres_exporter1:9187"]
        labels:
          nodo: "patroni1"
      - targets: ["postgres_exporter2:9187"]
        labels:
          nodo: "patroni2"

  # Estado del cluster segun Patroni: quien es lider, si hay lider, linea de tiempo, si PostgreSQL corre.
  - job_name: "patroni"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["patroni1:8008"]
        labels:
          nodo: "patroni1"
      - targets: ["patroni2:8008"]
        labels:
          nodo: "patroni2"
